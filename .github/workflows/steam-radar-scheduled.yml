name: Collect Steam radar scheduled

on:
  schedule:
    # GitHub cron uses UTC; collect at minute 47 of every hour.
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      source_commit_sha:
        description: "Replay an existing data commit instead of collecting"
        required: false
        type: string
      enrich_search:
        description: "Force Google Suggest and SERP enrichment for a new collection"
        required: false
        default: false
        type: boolean
      collect_only:
        description: "Canary: collect and validate without committing or synchronizing D1"
        required: false
        default: false
        type: boolean
      watchdog:
        description: "Automated recovery dispatch; honor freshness and replay preflight"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: steam-radar-collector
  cancel-in-progress: false

jobs:
  collect-and-sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RADAR_COLLECTION_MODE == 'github-actions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RADAR_INGEST_URL: ${{ secrets.RADAR_INGEST_URL }}
      RADAR_INGEST_SECRET: ${{ secrets.RADAR_INGEST_SECRET }}
      RADAR_STATUS_URL: ${{ vars.RADAR_STATUS_URL }}
      RADAR_MIN_COLLECTION_AGE_MINUTES: ${{ vars.RADAR_MIN_COLLECTION_AGE_MINUTES || '55' }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      RADAR_FORCE_ENRICHMENT: ${{ inputs.enrich_search || 'false' }}

    steps:
      - name: Check out public collector and data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit_sha || 'main' }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate configuration
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.collect_only }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RADAR_INGEST_URL"
          test -n "$RADAR_INGEST_SECRET"

      - name: Choose automated action
        id: preflight
        if: ${{ github.event_name == 'schedule' || inputs.watchdog }}
        working-directory: collector
        shell: bash
        run: node --experimental-strip-types scripts/radar/preflight.ts

      - name: Collect public radar evidence
        if: ${{ ((github.event_name == 'schedule' || inputs.watchdog) && steps.preflight.outputs.action == 'collect') || (github.event_name == 'workflow_dispatch' && !inputs.watchdog && inputs.source_commit_sha == '') }}
        working-directory: collector
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/radar/collect.ts \
            --output "$GITHUB_WORKSPACE/radar-payload.json"

      - name: Persist collection in this repository
        if: ${{ !inputs.collect_only && (((github.event_name == 'schedule' || inputs.watchdog) && steps.preflight.outputs.action == 'collect') || (github.event_name == 'workflow_dispatch' && !inputs.watchdog && inputs.source_commit_sha == '')) }}
        working-directory: collector
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/radar/persist-data.ts \
            --payload "$GITHUB_WORKSPACE/radar-payload.json" \
            --repo "$GITHUB_WORKSPACE"

      - name: Commit radar data
        if: ${{ !inputs.collect_only && (((github.event_name == 'schedule' || inputs.watchdog) && steps.preflight.outputs.action == 'collect') || (github.event_name == 'workflow_dispatch' && !inputs.watchdog && inputs.source_commit_sha == '')) }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "site-launch-hub-radar[bot]"
          git config user.email "site-launch-hub-radar[bot]@users.noreply.github.com"
          git add manifests schema steam
          if ! git diff --cached --quiet; then
            run_id="$(node -p "JSON.parse(require('fs').readFileSync('manifests/latest.json','utf8')).runId")"
            git commit \
              -m "Preserve evidence for $run_id" \
              -m "Constraint: Only sanitized public Steam evidence is stored\nConfidence: high\nScope-risk: narrow\nTested: Payload schema validation and checksum generation"
            git push origin HEAD:main
          fi

      - name: Resolve pending Git evidence
        if: ${{ (github.event_name == 'schedule' || inputs.watchdog) && steps.preflight.outputs.action == 'replay' }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="${{ steps.preflight.outputs.manifest_commit }}"
          payload_path="${{ steps.preflight.outputs.payload_path }}"
          test -n "$source_commit"
          test -n "$payload_path"
          git show "$source_commit:$payload_path" > "$GITHUB_WORKSPACE/radar-payload.json"
          printf 'RADAR_SOURCE_COMMIT=%s\n' "$source_commit" >> "$GITHUB_ENV"
          printf 'RADAR_PAYLOAD_PATH=%s\n' "$GITHUB_WORKSPACE/radar-payload.json" >> "$GITHUB_ENV"

      - name: Resolve committed payload
        if: ${{ !inputs.collect_only && !((github.event_name == 'schedule' || inputs.watchdog) && (steps.preflight.outputs.action == 'replay' || steps.preflight.outputs.action == 'skip')) }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          payload_path="$(node -p "JSON.parse(require('fs').readFileSync('manifests/latest.json','utf8')).payloadPath")"
          test -f "$payload_path"
          printf 'RADAR_SOURCE_COMMIT=%s\n' "$source_commit" >> "$GITHUB_ENV"
          printf 'RADAR_PAYLOAD_PATH=%s\n' "$GITHUB_WORKSPACE/$payload_path" >> "$GITHUB_ENV"

      - name: Synchronize D1 projection
        if: ${{ !inputs.collect_only && !((github.event_name == 'schedule' || inputs.watchdog) && steps.preflight.outputs.action == 'skip') }}
        working-directory: collector
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/radar/sync-d1.ts \
            --payload "$RADAR_PAYLOAD_PATH" \
            --source-commit "$RADAR_SOURCE_COMMIT"

      - name: Summarize radar decision
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Steam radar run"
            echo "- Event: ${{ github.event_name }}"
            echo "- Watchdog: ${{ inputs.watchdog || false }}"
            echo "- Preflight action: ${{ steps.preflight.outputs.action || 'forced-manual' }}"
            echo "- Preflight reason: ${{ steps.preflight.outputs.reason || 'manual' }}"
            echo "- Drift: ${{ steps.preflight.outputs.drift || false }}"
            echo "- Evidence commit: ${{ steps.preflight.outputs.manifest_commit || 'resolved-after-collection' }}"
          } >> "$GITHUB_STEP_SUMMARY"
